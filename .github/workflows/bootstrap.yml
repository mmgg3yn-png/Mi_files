# Rebuild Termux packages for the prefix /data/data/com.mimax.files/files/usr,
# assemble an apt repository (GitHub Pages, branch gh-pages), and publish bootstrap zips.
# The package list must contain base package names; Termux subpackages are generated automatically.
# Why rebuild: "com.termux" (10 chars) -> "com.mimax.files" (15 chars); the prefix is baked into ELF files.
name: Build Bootstrap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: write }
env:
  PKG: com.mimax.files
  REPO_URL: https://mmgg3yn-png.github.io/Mi_files/apt
  BOOTSTRAP_PKGS: >-
    bash coreutils apt dpkg termux-tools termux-exec termux-keyring termux-core termux-am termux-am-socket
    ca-certificates libcurl findutils grep sed gawk tar gzip libbz2 liblzma less nano procps psmisc util-linux
  EXTRA_PKGS: zsh git openssh python nodejs
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: { arch: [aarch64, arm, x86_64] }
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h /
      - run: git clone --depth 1 https://github.com/termux/termux-packages tp
      - name: Validate package targets
        working-directory: tp
        run: |
          set -euo pipefail
          for package in $BOOTSTRAP_PKGS $EXTRA_PKGS; do
            if [[ ! -f "packages/$package/build.sh" ]]; then
              echo "::error::Invalid Termux package target '$package': packages/$package/build.sh does not exist. Use the base package name; subpackages are generated automatically."
              exit 1
            fi
          done
          echo "All requested package targets exist."
      - name: Re-target to ${{ env.PKG }}
        working-directory: tp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pkg = os.environ['PKG']
          root = Path('scripts')
          old_path = '/data/data/com.termux'
          new_path = f'/data/data/{pkg}'
          old_package = 'TERMUX_APP__PACKAGE_NAME="com.termux"'
          new_package = f'TERMUX_APP__PACKAGE_NAME="{pkg}"'
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original.replace(old_path, new_path)
              if path == root / 'properties.sh':
                  updated = updated.replace(old_package, new_package)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
          props = (root / 'properties.sh').read_text(encoding='utf-8')
          if new_package not in props:
              raise SystemExit('Failed to set TERMUX_APP__PACKAGE_NAME')
          if old_path in props:
              raise SystemExit('Old Termux data path remains in properties.sh')
          PY
          cat >> scripts/properties.sh <<EOP
          TERMUX_REPO_URL=("${{ env.REPO_URL }}")
          TERMUX_REPO_DISTRIBUTION=("stable")
          TERMUX_REPO_COMPONENT=("main")
          EOP
          grep -nF 'TERMUX_APP__PACKAGE_NAME="${{ env.PKG }}"' scripts/properties.sh
          grep -nF 'TERMUX_REPO_URL=' scripts/properties.sh
      - name: Build builder image for the new prefix
        working-directory: tp/scripts
        run: docker build -t mi-package-builder .
      - name: Build packages from source (several hours)
        working-directory: tp
        env: { TERMUX_BUILDER_IMAGE_NAME: mi-package-builder }
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a ${{ matrix.arch }} -o output $BOOTSTRAP_PKGS $EXTRA_PKGS
          test -n "$(find output -maxdepth 1 -name '*.deb' -print -quit)"
          ls -lh output | head -100
      - uses: actions/upload-artifact@v4
        with: { name: "debs-${{ matrix.arch }}", path: tp/output/*.deb, if-no-files-found: error }

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: debs, pattern: "debs-*", merge-multiple: true }
      - run: git clone --depth 1 https://github.com/termux/termux-packages tp && git clone --depth 1 https://github.com/termux/termux-apt-repo apt-repo
      - name: Retarget bootstrap generator to the custom app prefix
        working-directory: tp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pkg = os.environ['PKG']
          root = Path('scripts')
          old_path = '/data/data/com.termux'
          new_path = f'/data/data/{pkg}'
          old_package = 'TERMUX_APP__PACKAGE_NAME="com.termux"'
          new_package = f'TERMUX_APP__PACKAGE_NAME="{pkg}"'
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original.replace(old_path, new_path)
              if path == root / 'properties.sh':
                  updated = updated.replace(old_package, new_package)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
          props = (root / 'properties.sh').read_text(encoding='utf-8')
          if new_package not in props:
              raise SystemExit('Failed to set TERMUX_APP__PACKAGE_NAME for bootstrap generation')
          PY
          grep -nF 'TERMUX_APP__PACKAGE_NAME="${{ env.PKG }}"' scripts/properties.sh
      - name: Assemble apt repo
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y apt-utils zip curl
          test -n "$(find debs -name '*.deb' -print -quit)"
          mkdir -p site/apt
          ./apt-repo/termux-apt-repo debs site/apt stable main
          find site -maxdepth 4 | head -30
      - uses: peaceiris/actions-gh-pages@v4
        with: { github_token: "${{ secrets.GITHUB_TOKEN }}", publish_dir: ./site }
      - name: Generate bootstrap zips from the freshly built repo
        run: |
          set -euo pipefail
          (cd site/apt && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          cd tp
          ./scripts/generate-bootstraps.sh --architectures aarch64,arm,x86_64 --repository http://127.0.0.1:8000
          for arch in aarch64 arm x86_64; do
            test -s "bootstrap-${arch}.zip"
            unzip -tq "bootstrap-${arch}.zip"
          done
          ls -lh bootstrap-*.zip
      - name: Publish to release 'bootstrap'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          gh release create bootstrap --repo "$GITHUB_REPOSITORY" --title bootstrap --notes "Bootstrap for ${{ env.PKG }}" 2>/dev/null || true
          gh release upload bootstrap tp/bootstrap-*.zip --clobber --repo "$GITHUB_REPOSITORY"
