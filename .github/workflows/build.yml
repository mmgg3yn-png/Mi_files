name: Build APK
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Fetch bootstrap from release 'bootstrap' (REQUIRED)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          gh release download bootstrap -p 'bootstrap-aarch64.zip' -p 'bootstrap-arm.zip' -D app/src/main/assets --clobber
          for a in aarch64 arm; do
            test -s "app/src/main/assets/bootstrap-$a.zip" || { echo "::error::bootstrap-$a.zip missing or empty"; exit 1; }
            unzip -tq "app/src/main/assets/bootstrap-$a.zip"
            unzip -p "app/src/main/assets/bootstrap-$a.zip" SYMLINKS.txt >/dev/null
            unzip -l "app/src/main/assets/bootstrap-$a.zip" | grep -q ' bin/bash$' || { echo "::error::bootstrap-$a.zip has no bin/bash"; exit 1; }
          done
          ls -la app/src/main/assets
      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log
      - name: Verify bootstrap is really inside the APK
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$apk" | grep -E 'assets/bootstrap-(aarch64|arm)\.zip'
          for a in aarch64 arm; do
            unzip -l "$apk" | grep -q "assets/bootstrap-$a.zip" || { echo "::error::$a bootstrap not packaged in APK"; exit 1; }
          done
          aapt2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          "$aapt2" dump badging "$apk" | grep -E "^package: name='com.mimax.files'"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gradle-build-log, path: gradle-build.log }
      - uses: actions/upload-artifact@v4
        with:
          name: Mi_files-debug-apk
          path: app/build/outputs/apk/debug/*.apk
