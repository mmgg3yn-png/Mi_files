# Real on-device test: installs the bootstrap on an x86_64 emulator and runs bash, apt, pkg, python, git, node.
# Requires the 'bootstrap' release to contain bootstrap-x86_64.zip (built by bootstrap.yml).
# NOTE: this tests the x86_64 bootstrap only. aarch64/arm must be tested on a real ARM device (Settings > self-test).
name: Emulator smoke test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: Fetch bootstrap
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p app/src/main/assets
          gh release download bootstrap -p 'bootstrap-*.zip' -D app/src/main/assets --clobber
          ls -la app/src/main/assets
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          script: gradle :app:connectedDebugAndroidTest -PwithX86=true --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: app/build/reports/androidTests }
